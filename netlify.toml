[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Rewrite Google Apps Script API proxy to Netlify Serverless Function
[[redirects]]
  from = "/api/gas/proxy"
  to = "/.netlify/functions/gas-proxy"
  status = 200

[[redirects]]
  from = "/api/gas/*"
  to = "/.netlify/functions/gas-proxy"
  status = 200

# Rewrite AI endpoints if used
[[redirects]]
  from = "/api/ai/audit-regimen"
  to = "/.netlify/functions/audit-regimen"
  status = 200

[[redirects]]
  from = "/api/ai/compose-counseling"
  to = "/.netlify/functions/compose-counseling"
  status = 200

# Fallback for Single Page Application routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
